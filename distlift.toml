# distlift configuration for exdrf (exdrf-* monorepo).
#
# Per-package tag-only versioning; two remotes.

mode = "monorepo"
language = "python"
version_source = "tag"
remotes = ["origin", "advaita"]

[plugins]
directories = ["playground/distlift-plugins"]

[dependency_updates]
enabled = true
include_current_monorepo = true
python_version_template = ">={version}"

[monorepo]

packages = [
    "exdrf",
    "exdrf-al",
    "exdrf-pd",
    "exdrf-ts",
    "exdrf-qt",
    "exdrf-dev",
    "exdrf-gen",
    "exdrf-gen-openapi2rtk",
    "exdrf-gen-al2qt",
    "exdrf-gen-al2pd",
    "exdrf-gen-al2rcv",
    "exdrf-gen-al2at",
    "exdrf-gen-al2xl",
    "exdrf-gen-pd2dare",
    "exdrf-gen-al2r",
    "exdrf-util",
    "exdrf-xl",
    "exdrf-rcv",
]
